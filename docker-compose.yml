version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: festival_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Initialize the database automatically in order
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/triggers_and_procedures.sql:/docker-entrypoint-initdb.d/2_triggers.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/3_seed.sql

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/festival_db
      - PORT=3001
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  pgdata:
